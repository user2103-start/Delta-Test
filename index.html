        // ============================================================
        // ENCRYPTION/DECRYPTION - EXACT SAME LOGIC
        // ============================================================
        const TextDecoder = window.TextDecoder;
        const TextEncoder = window.TextEncoder;
        
        async function getDecryptionKey() {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(ENCRYPTION_KEY);
            const paddedKey = new Uint8Array(32);
            for (let i = 0; i < 32; i++) {
                paddedKey[i] = i < keyData.length ? keyData[i] : 0;
            }
            return crypto.subtle.importKey(
                "raw",
                paddedKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }
        
        function hexToUint8Array(hex) {
            return new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        }
        
        async function decryptPayload(encryptedData) {
            try {
                const [ivHex, cipherHex] = encryptedData.split(":");
                if (!ivHex || !cipherHex) throw new Error("Invalid encrypted payload format.");
                
                const iv = hexToUint8Array(ivHex);
                const ciphertext = hexToUint8Array(cipherHex);
                
                const key = await getDecryptionKey();
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ciphertext
                );
                
                const decoder = new TextDecoder();
                return JSON.parse(decoder.decode(decrypted));
            } catch (error) {
                console.error("Decryption failed:", error);
                return { success: false, error: "Decryption failed: " + error.message };
            }
        }
        
        // ============================================================
        // TOAST SYSTEM
        // ============================================================
        const ToastContext = React.createContext();
        
        function ToastProvider({ children }) {
            const [toasts, setToasts] = React.useState([]);
            
            const toast = React.useCallback(({ title, description, variant = "default", duration = 5000 }) => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, title, description, variant }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, duration);
            }, []);
            
            const dismiss = React.useCallback((id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            }, []);
            
            return (
                <ToastContext.Provider value={{ toast, dismiss }}>
                    {children}
                    {ReactDOM.createPortal(
                        <div className="toast-container">
                            {toasts.map(t => (
                                <div 
                                    key={t.id} 
                                    className={`toast ${t.variant === "destructive" ? "destructive" : ""}`}
                                    onClick={() => dismiss(t.id)}
                                >
                                    <strong>{t.title}</strong>
                                    {t.description && <p style={{margin: '4px 0 0', fontSize: '14px'}}>{t.description}</p>}
                                </div>
                            ))}
                        </div>,
                        document.getElementById("toast-container")
                    )}
                </ToastContext.Provider>
            );
        }
        
        function useToast() {
            return React.useContext(ToastContext);
        }
        
        // ============================================================
        // LOADING CONTEXT
        // ============================================================
        const LoadingContext = React.createContext();
        
        function LoadingProvider({ children }) {
            const [loading, setLoading] = React.useState(false);
            
            const start = React.useCallback(() => setLoading(true), []);
            const done = React.useCallback(() => setLoading(false), []);
            
            return (
                <LoadingContext.Provider value={{ loading, start, done }}>
                    {children}
                </LoadingContext.Provider>
            );
        }
        
        function useLoading() {
            const ctx = React.useContext(LoadingContext);
            if (!ctx) throw new Error("useLoading must be used within LoadingProvider");
            return ctx;
        }
                // ============================================================
        // ROUTER CONTEXT
        // ============================================================
        const RouterContext = React.createContext();
        
        function useRouter() {
            return React.useContext(RouterContext);
        }
        
        function useSearchParams() {
            const searchParams = new URLSearchParams(window.location.search);
            return React.useMemo(() => searchParams, []);
        }
        
        function useParams() {
            const path = window.location.pathname;
            const segments = path.split("/").filter(Boolean);
            // Extract batchId from URL: /study-v2/batches/{batchId}
            const batchIdIndex = segments.indexOf("batches") + 1;
            const batchId = batchIdIndex > 0 && batchIdIndex < segments.length 
                ? segments[batchIdIndex] 
                : null;
            return React.useMemo(() => ({ batchId }), [batchId]);
        }
        
        function usePathname() {
            const [pathname, setPathname] = React.useState(window.location.pathname);
            
            React.useEffect(() => {
                const handlePopState = () => setPathname(window.location.pathname);
                window.addEventListener("popstate", handlePopState);
                return () => window.removeEventListener("popstate", handlePopState);
            }, []);
            
            return pathname;
        }
        
        // Simple SPA Router
        function RouterProvider({ children }) {
            const [currentPath, setCurrentPath] = React.useState(window.location.pathname + window.location.search);
            
            React.useEffect(() => {
                const handlePopState = () => {
                    setCurrentPath(window.location.pathname + window.location.search);
                };
                window.addEventListener("popstate", handlePopState);
                return () => window.removeEventListener("popstate", handlePopState);
            }, []);
            
            const push = React.useCallback((url) => {
                window.history.pushState({}, "", url);
                setCurrentPath(url);
                window.scrollTo(0, 0);
            }, []);
            
            const replace = React.useCallback((url) => {
                window.history.replaceState({}, "", url);
                setCurrentPath(url);
            }, []);
            
            const back = React.useCallback(() => {
                window.history.back();
            }, []);
            
            const value = React.useMemo(() => ({
                push,
                replace,
                back,
                pathname: window.location.pathname,
            }), [push, replace, back]);
            
            return (
                <RouterContext.Provider value={value}>
                    {children}
                </RouterContext.Provider>
            );
        }

                    <div className="flex items-center gap-2 flex-shrink-0">
                        {showSearch && (
                            isSearchOpen ? (
                                <div className="absolute left-0 right-0 top-0 bottom-0 bg-black flex items-center px-4" style={{ position: "absolute" }}>
                                    <Button variant="ghost" size="icon" onClick={() => setSearchOpen(false)} style={{ marginLeft: "-8px" }}>
                                        <ChevronLeft className="h-6 w-6" />
                                    </Button>
                                    <input
                                        type="text"
                                        placeholder="Search for a batch..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="bg-black text-white border-none focus:ring-0 w-full h-full text-lg"
                                        autoFocus
                                        style={{ background: "transparent", border: "none", outline: "none", color: "white", fontSize: "1.125rem" }}
                                    />
                                </div>
                            ) : (
                                <Button variant="ghost" size="icon" onClick={() => setSearchOpen(true)}>
                                    <Search2 className="h-5 w-5" />
                                </Button>
                            )
                        )}
                    </div>
                </header>
            );
        }

        // ============================================================
        // AUTH SHEET (LOGIN MODAL)
        // ============================================================
        function AuthSheet({ isOpen, onClose }) {
            const [step, setStep] = React.useState("phone");
            const [phoneNumber, setPhoneNumber] = React.useState("");
            const [otp, setOtp] = React.useState("");
            const [isSubmitting, setIsSubmitting] = React.useState(false);
            const { toast } = useToast();

            const handleSendOtp = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/pw/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ phoneNumber, username: phoneNumber }),
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        toast({ title: "OTP Sent!", description: "Please check your phone for the code." });
                        setStep("otp");
                    } else {
                        throw new Error(data.message || "Failed to send OTP.");
                    }
                } catch (error) {
                    toast({ variant: "destructive", title: "Error", description: error.message });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleVerifyOtp = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/pw/verify`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ otp, phoneNumber, username: phoneNumber }),
                    });
                    const data = await response.json();
                    if (response.ok && data.success && data.accessToken) {
                        localStorage.setItem("accessToken", data.accessToken);
                        localStorage.setItem("refreshToken", data.refreshToken);
                        if (data.user) localStorage.setItem("user", JSON.stringify(data.user));
                        localStorage.removeItem("enrolledBatches");
                        toast({ title: "Login Successful!", description: "You are now logged in." });
                        onClose();
                        setTimeout(() => window.location.reload(), 500);
                    } else {
                        throw new Error(data.message || "Invalid OTP.");
                    }
                } catch (error) {
                    toast({ variant: "destructive", title: "Verification Failed", description: error.message });
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <Sheet open={isOpen} onOpenChange={(open) => { if (!open) { onClose(); setPhoneNumber(""); setOtp(""); setStep("phone"); setIsSubmitting(false); } }} side="bottom">
                    <div className="rounded-t-2xl p-4 md:p-6" style={{ background: "white", color: "#171717" }}>
                        <SheetHeader className="text-center mb-4">
                            <SheetTitle className="text-2xl font-bold" style={{ color: "#171717" }}>
                                {step === "phone" ? "Login" : "Enter OTP"}
                            </SheetTitle>
                            <SheetDescription style={{ color: "#737373" }}>
                                {step === "phone" 
                                    ? "Enter your phone number to continue."
                                    : `A code has been sent to +91 ${phoneNumber}.`
                                }
                            </SheetDescription>
                        </SheetHeader>
                        
                        {step === "phone" ? (
                            <form onSubmit={handleSendOtp} className="space-y-4">
                                <div className="flex items-center border rounded-md h-12 bg-white">
                                    <span className="pl-3 pr-2 text-gray-500 text-lg">+91</span>
                                    <div style={{ width: "1px", height: "24px", background: "#d1d5db" }} />
                                    <Input
                                        id="phone"
                                        type="tel"
                                        value={phoneNumber}
                                        onChange={(e) => setPhoneNumber(e.target.value.replace(/\D/g, ""))}
                                        placeholder="10-digit mobile number"
                                        required
                                        className="border-none h-full text-lg focus-visible:ring-0"
                                        pattern="\d{10}"
                                        maxLength={10}
                                        title="Please enter a valid 10-digit phone number"
                                        style={{ border: "none", flex: 1 }}
                                    />
                                </div>
                                <Button 
                                    type="submit" 
                                    className="w-full h-12 text-lg" 
                                    disabled={isSubmitting}
                                    style={{ background: "#5a4bda", height: "48px", fontSize: "1.125rem", width: "100%" }}
                                >
                                    {isSubmitting ? <LoaderCircle className="animate-spin h-5 w-5" /> : "Send OTP"}
                                </Button>
                            </form>
                        ) : (
                            <form onSubmit={handleVerifyOtp} className="space-y-4">
                                <div className="relative">
                                    <KeyRound className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" style={{ position: "absolute", left: "12px", top: "50%", transform: "translateY(-50%)" }} />
                                    <Input
                                        id="otp"
                                        type="text"
                                        value={otp}
                                        onChange={(e) => setOtp(e.target.value)}
                                        placeholder="6-digit OTP"
                                        required
                                        className="pl-10 h-12 text-lg tracking-widest text-center"
                                        maxLength={6}
                                        style={{ paddingLeft: "40px", textAlign: "center", letterSpacing: "0.1em" }}
                                    />
                                </div>
                                <Button 
                                    type="submit" 
                                    className="w-full h-12 text-lg" 
                                    disabled={isSubmitting}
                                    style={{ background: "#5a4bda", height: "48px", fontSize: "1.125rem", width: "100%" }}
                                >
                                    {isSubmitting ? <LoaderCircle className="animate-spin h-5 w-5" /> : "Verify & Login"}
                                </Button>
                                <Button 
                                    variant="link" 
                                    onClick={() => setStep("phone")} 
                                    className="w-full"
                                    style={{ width: "100%", textAlign: "center" }}
                                >
                                    Use a different number
                                </Button>
                            </form>
                        )}
                    </div>
                </Sheet>
            );
        }
                // ============================================================
        // BATCH DETAIL PAGE - MAIN COMPONENT
        // ============================================================
        function BatchDetailPage() {
            const router = useRouter();
            const searchParams = useSearchParams();
            const params = useParams();
            const { start: startLoading } = useLoading();
            const { toast } = useToast();
            
            const batchName = searchParams.get("name") || "Batch";
            const batchId = params.batchId;
            
            const [batchDetails, setBatchDetails] = React.useState(null);
            const [liveClasses, setLiveClasses] = React.useState([]);
            const [loadingBatch, setLoadingBatch] = React.useState(true);
            const [loadingClasses, setLoadingClasses] = React.useState(true);
            const [error, setError] = React.useState(null);
            
            // Fetch live classes
            const fetchLiveClasses = React.useCallback(async (bId) => {
                setLoadingClasses(true);
                setLiveClasses([]);
                try {
                    const response = await fetch(`${API_BASE_URL}/api/pw/live`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ batchId: bId }),
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    if (data.data && Array.isArray(data.data)) {
                        setLiveClasses(data.data);
                    } else {
                        console.error("API call for live classes failed:", data.message);
                        setLiveClasses([]);
                    }
                } catch (err) {
                    console.error("Failed to fetch schedule:", err);
                    setLiveClasses([]);
                } finally {
                    setLoadingClasses(false);
                }
            }, []);
            
            // Fetch batch details with decryption
            React.useEffect(() => {
                if (batchId) {
                    fetchLiveClasses(batchId);
                    
                    (async () => {
                        setLoadingBatch(true);
                        setError(null);
                        try {
                            const response = await fetch(`${API_BASE_URL}/api/pw/batchdetails`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ searchParams: { BatchId: batchId } }),
                            });
                            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                            
                            const data = await response.json();
                            if (!data.data) throw new Error("No encrypted data in response.");
                            
                            const decrypted = await decryptPayload(data.data);
                            if (decrypted.success) {
                                setBatchDetails(decrypted.data);
                            } else {
                                throw new Error(decrypted.error || "Failed to decrypt batch details");
                            }
                        } catch (err) {
                            console.error("Error fetching batch details:", err);
                            setError(err.message);
                        } finally {
                            setLoadingBatch(false);
                        }
                    })();
                }
            }, [batchId, fetchLiveClasses]);
            
            // Navigate to subject
            const handleSubjectClick = (subject) => {
                startLoading();
                router.push(`/study-v2/batches/${batchId}/${subject.slug}?subjectName=${encodeURIComponent(subject.subject)}&subjectId=${subject.subjectId}`);
            };
            
            // Play video
            const handlePlay = (classItem) => {
                startLoading();
                const topic = (classItem.topic || "").toLowerCase();
                const isRecorded = topic.includes("recorded") || (classItem.tag && classItem.tag.toLowerCase() === "ended");
                const findKey = classItem.videoDetails?.findKey || classItem._id;
                const videoType = isRecorded ? "drm" : "aws";
                
                router.push(`/pw/${videoType}/play?video_id=${findKey}&subject_slug=${classItem.subjectId.slug}&batch_id=${classItem.batchId}&schedule_id=${classItem._id}&subject_id=${classItem.subjectId._id}`);
            };
            
            // Format time
            const formatTime = (dateStr) => {
                return new Date(dateStr).toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true,
                });
            };
            
            // Get class status badge
            const getClassBadge = (classItem) => {
                const topic = (classItem.topic || "").toLowerCase();
                if (topic.includes("cancelled") || topic.includes("canceled")) {
                    return <Badge variant="destructive" className="absolute top-2 right-2">Cancelled</Badge>;
                }
                const tag = (classItem.tag || "").toLowerCase();
                if (tag === "ended" || topic.includes("recorded")) {
                    return <Badge className="absolute top-2 right-2 bg-gray-900/80 text-white border-none">Recorded</Badge>;
                }
                if (tag === "live") {
                    return <Badge className="absolute top-2 right-2 bg-red-600 text-white border-none animate-pulse">LIVE</Badge>;
                }
                return <Badge variant="secondary" className="absolute top-2 right-2 bg-yellow-500 text-black border-none">{classItem.tag?.toUpperCase()}</Badge>;
            };
            
            // Share handler
            const handleShare = () => {
                const url = window.location.href;
                const text = `Check out this course from Δ 𝘿𝙚𝙡𝙩𝙖 𝙎𝙩𝙪𝙙𝙮: ${url}`;
                const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
                window.open(whatsappUrl, "_blank");
            };
            
            // Announcements handler
            const handleAnnouncements = () => {
                startLoading();
                router.push(`/study-v2/batches/${batchId}/announcements`);
            };
            
            // Render description HTML safely
            const renderDescription = (htmlString) => {
                if (!htmlString) return null;
                return <div dangerouslySetInnerHTML={{ __html: htmlString }} />;
            };
            
            const displayName = batchDetails?.name || batchName;
            
            return (
                <div className="min-h-screen bg-gray-100">
                    <Header title={displayName} showMenu={true} loading={false} />
                    
                    <main className="pb-4">
                        {/* Share & Announcement Buttons */}
                        <div className="p-4 bg-white">
                            <div className="flex gap-2 mb-4">
                                <Button variant="outline" className="flex-1" onClick={handleShare}>
                                    <Share2 className="h-4 w-4" />
                                    Share
                                </Button>
                                <Button variant="outline" className="flex-1" onClick={handleAnnouncements}>
                                    <Bell2 className="h-4 w-4" />
                                    Announcement
                                </Button>
                            </div>
                        </div>
                        
                        {/* Today's Classes */}
                        <div className="p-4">
                            <h2 className="text-xl font-bold mb-4">Today's Classes</h2>
                            
                            {loadingClasses ? (
                                <div className="flex space-x-4 overflow-hidden">
                                    {[1, 2].map((i) => (
                                        <Card key={i} className="min-w-[300px] w-[300px] p-3" style={{ minWidth: "300px", width: "300px" }}>
                                            <Skeleton className="w-full aspect-video rounded-lg" style={{ aspectRatio: "16/9" }} />
                                            <div className="mt-3 space-y-2">
                                                <Skeleton className="h-4 w-1/2" />
                                                <Skeleton className="h-5 w-3/4" />
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            ) : liveClasses.length > 0 ? (
                                <div className="flex space-x-4 pb-2 overflow-x-auto" style={{ overflowX: "auto" }}>
                                    {liveClasses.map((classItem) => {
                                        const isCancelled = (classItem.topic || "").toLowerCase().includes("cancelled") || 
                                                            (classItem.topic || "").toLowerCase().includes("canceled");
                                        const isDisabled = isCancelled || (classItem.tag && classItem.tag.toLowerCase() === "upcoming");
                                        
                                        return (
                                            <Card 
                                                key={classItem._id} 
                                                className="min-w-[300px] w-[300px] bg-white rounded-xl shadow-md overflow-hidden flex flex-col"
                                                style={{ minWidth: "300px", width: "300px", flexShrink: 0 }}
                                            >
                                                <CardContent className="p-3 flex-grow flex flex-col">
                                                    <div className="relative aspect-video w-full rounded-lg overflow-hidden bg-gray-100">
                                                        <img
                                                            src={(classItem.videoDetails && classItem.videoDetails.image) || "https://i.ibb.co/9Hm0NqsH/f69ed82b-7169-45fc-a82b-915e453c6340.png"}
                                                            alt={classItem.topic}
                                                            className="absolute inset-0 w-full h-full object-cover"
                                                            style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", objectFit: "cover" }}
                                                        />
                                                        {getClassBadge(classItem)}
                                                    </div>
                                                    
                                                    <div className="mt-3 flex-grow flex flex-col">
                                                        <p className="font-semibold text-sm text-indigo-600">{classItem.subjectId.name}</p>
                                                        <h3 className="font-bold text-md mt-1 flex-grow">{classItem.topic}</h3>
                                                        
                                                        <div className="flex justify-between items-center text-xs text-gray-500 mt-2">
                                                            <div className="flex items-center gap-1.5">
                                                                <User2 className="h-3 w-3" />
                                                                <span>{(classItem.teachers && classItem.teachers[0] && classItem.teachers[0].name) || "N/A"}</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5">
                                                                <Clock2 className="h-3 w-3" />
                                                                <span>{formatTime(classItem.startTime)}</span>
                                                            </div>
                                                        </div>
                                                        
                                                        <Button
                                                            onClick={() => handlePlay(classItem)}
                                                            className="w-full mt-4"
                                                            style={{ background: "#5a4bda", width: "100%", marginTop: "1rem" }}
                                                            disabled={isDisabled}
                                                        >
                                                            <CirclePlay className="h-5 w-5" />
                                                            Play
                                                        </Button>
                                                    </div>
                                                </CardContent>
                                            </Card>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center py-8 px-4 bg-white rounded-xl">
                                    <img 
                                        src="https://static.pw.live/study-mf/assets/images/recent-learning-no-data-1770062657.svg"
                                        alt="No Content Found"
                                        className="w-32 h-32 mb-4 object-contain"
                                        style={{ width: "128px", height: "128px" }}
                                    />
                                    <p className="text-gray-500 text-base font-medium">No Content Found</p>
                                </div>
                            )}
                        </div>
                        
                        {/* Subjects */}
                        <div className="p-4">
                            <h2 className="text-xl font-bold mb-4">Subjects</h2>
                            
                            {loadingBatch ? (
                                <div className="space-y-3">
                                    {[1, 2, 3, 4].map((i) => (
                                        <Card key={i} className="p-4 flex items-center justify-between gap-4 shadow-sm bg-white">
                                            <div className="flex items-center gap-4">
                                                <Skeleton className="h-10 w-10 rounded" />
                                                <Skeleton className="h-4 w-[150px]" />
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            ) : batchDetails && batchDetails.subjects && batchDetails.subjects.length > 0 ? (
                                <div className="space-y-3">
                                    {batchDetails.subjects.map((subject) => (
                                        <Card
                                            key={subject._id}
                                            className="p-4 flex items-center justify-between gap-4 shadow-sm bg-white cursor-pointer"
                                            onClick={() => handleSubjectClick(subject)}
                                            style={{ cursor: "pointer" }}
                                        >
                                            <div className="flex items-center gap-4">
                                                <img
                                                    src={subject.icon || "https://static.pw.live/react-batches/assets/svg/subjects/defaultSubject.svg"}
                                                    alt={subject.subject}
                                                    width={40}
                                                    height={40}
                                                />
                                                <h3 className="font-bold text-base">{subject.subject}</h3>
                                            </div>
                                        </Card>
                                    ))}
                                </div>
                            ) : (
                                <div className="flex flex-col items-center justify-center py-8 px-4 bg-white rounded-xl">
                                    <img 
                                        src="https://static.pw.live/study-mf/assets/images/recent-learning-no-data-1770062657.svg"
                                        alt="No Content Found"
                                        className="w-32 h-32 mb-4 object-contain"
                                        style={{ width: "128px", height: "128px" }}
                                    />
                                    <p className="text-gray-500 text-base font-medium">No Content Found</p>
                                </div>
                            )}
                        </div>
                        
                        {/* About Batch */}
                        {loadingBatch ? (
                            <div className="p-4">
                                <Skeleton className="h-40 w-full" />
                            </div>
                        ) : batchDetails && (
                            <Card className="m-4">
                                <CardContent className="p-4">
                                    <h2 className="text-xl font-bold mb-4">About Batch</h2>
                                    <div className="text-gray-600 prose prose-sm max-w-full">
                                        {renderDescription(batchDetails.description)}
                                    </div>
                                </CardContent>
                            </Card>
                        )}
                    </main>
                </div>
            );
        }
                // ============================================================
        // NOT FOUND PAGE
        // ============================================================
        function NotFoundPage() {
            const router = useRouter();
            
            React.useEffect(() => {
                const timer = setTimeout(() => {
                    router.replace("/");
                }, 2000);
                return () => clearTimeout(timer);
            }, [router]);
            
            return (
                <div className="flex h-screen items-center justify-center bg-gray-100">
                    <div className="flex flex-col items-center space-y-4">
                        <div className="flex items-center space-x-2">
                            <div className="w-4 h-4 rounded-full bg-indigo-500 animate-pulse" />
                            <div className="w-4 h-4 rounded-full bg-indigo-500 animate-pulse" style={{ animationDelay: "0.2s" }} />
                            <div className="w-4 h-4 rounded-full bg-indigo-500 animate-pulse" style={{ animationDelay: "0.4s" }} />
                        </div>
                        <p className="text-lg font-semibold text-gray-700">Page not found. Redirecting to homepage...</p>
                    </div>
                </div>
            );
        }
        
        // ============================================================
        // SIMPLE PAGE ROUTER
        // ============================================================
        function PageRouter() {
            const pathname = usePathname();
            
            // Route matching
            if (pathname.startsWith("/study-v2/batches/") && 
                pathname.split("/").filter(Boolean).length >= 3 && 
                !pathname.includes("/announcements") &&
                !pathname.split("/").filter(Boolean)[3]) {
                return <BatchDetailPage />;
            }
            
            // Home page placeholder
            if (pathname === "/" || pathname === "") {
                return (
                    <div className="min-h-screen bg-gray-100">
                        <Header title="Δ 𝘿𝙚𝙡𝙩𝙖 𝙎𝙩𝙪𝙙𝙮" showMenu={true} />
                        <main className="p-4">
                            <div className="flex flex-col items-center justify-center py-16">
                                <h1 className="text-3xl font-bold mb-4">Welcome to Delta Study</h1>
                                <p className="text-gray-500">Select a batch to get started.</p>
                            </div>
                        </main>
                    </div>
                );
            }
            
            // 404 fallback
            return <NotFoundPage />;
        }
        
        // ============================================================
        // TOP LOADING BAR
        // ============================================================
        function TopLoadingBar() {
            const { loading } = useLoading();
            
            if (!loading) return null;
            
            return (
                <div className="fixed top-0 left-0 w-full h-1.5 z-[9999] overflow-hidden" style={{ height: "6px", zIndex: 9999 }}>
                    <div className="w-full h-full bg-indigo-500 animate-pulse" />
                </div>
            );
        }
        
        // ============================================================
        // APP COMPONENT
        // ============================================================
        function App() {
            const [authSheetOpen, setAuthSheetOpen] = React.useState(false);
            
            React.useEffect(() => {
                // Set page title dynamically
                const pathname = window.location.pathname;
                if (pathname.startsWith("/rojgarwithankit")) {
                    document.title = "Rojgar With Ankit";
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute("content", "Your gateway to a successful career with Rojgar with Ankit.");
                } else {
                    document.title = "Δ 𝘿𝙚𝙡𝙩𝙖 𝙎𝙩𝙪𝙙𝙮";
                }
            }, []);
            
            return (
                <ToastProvider>
                    <LoadingProvider>
                        <RouterProvider>
                            <TopLoadingBar />
                            <PageRouter />
                            <AuthSheet 
                                isOpen={authSheetOpen} 
                                onClose={() => setAuthSheetOpen(false)} 
                            />
                        </RouterProvider>
                    </LoadingProvider>
                </ToastProvider>
            );
        }
        
        // ============================================================
        // RENDER APP
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
        
        console.log("✅ Delta Study App Loaded Successfully!");
        console.log("📡 API Base:", API_BASE_URL);
        console.log("🔐 Encryption Key:", ENCRYPTION_KEY.substring(0, 4) + "****");
    </script>
</body>
